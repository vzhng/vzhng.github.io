<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Veronica Zhang — Portfolio</title>
    <style>
      :root {
        --bg: #f6f3ee;
        --ink: #1c1917;
        --muted: #57534e;
        --accent: #0f766e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 80% 60% at 20% 10%, rgba(15, 118, 110, 0.12), transparent 55%),
          radial-gradient(ellipse 70% 50% at 90% 80%, rgba(120, 113, 108, 0.15), transparent 50%),
          var(--bg);
      }

      main {
        max-width: 36rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2.25rem, 6vw, 3.5rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      p {
        margin: 0;
        font-size: 1.125rem;
        line-height: 1.55;
        color: var(--muted);
      }

      .accent {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Veronica Zhang</h1>
      <p>
        Personal portfolio — art, baking, itineraries, and projects.
        <span class="accent">Coming soon.</span>
      </p>
    </main>
  </body>
</html>
